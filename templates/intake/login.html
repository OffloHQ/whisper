{% extends "base.html" %}

{% block title %}Intake Login | Whisper{% endblock %}
{% block page_header %}{% endblock %}

{% block content %}
<section class="card" style="display:grid; gap:1rem; max-width:30rem; margin:2rem auto 0;">
    <div style="display:grid; gap:0.35rem;">
        <h1 style="margin:0;">Reviewer Login</h1>
        <p class="muted" style="margin:0;">Restricted intake access for Whisper reviewers.</p>
    </div>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Sign In</button>
    </form>
</section>
{% endblock %}
