{% extends "emails/base_email.html" %}

{% block email_content %}
<div style="text-align:center;">
  <div style="font-size:24px; line-height:1.3; font-weight:600; margin:0 0 14px;">
    Complete your Whisper signup
  </div>
  <div style="font-size:16px; line-height:1.7; color:#4f463d; margin:0 auto; max-width:430px;">
    You requested access to Whisper and can still complete your signup.
  </div>
  <div style="font-size:16px; line-height:1.7; color:#4f463d; margin:18px auto 0; max-width:430px;">
    This is a reminder from day {{ reminder_day }} of the signup window.
  </div>
  <div style="margin:24px 0 0;">
    <a href="{{ signup_url }}" style="display:inline-block; padding:12px 22px; border:1px solid #1f1a14; color:#ffffff; background-color:#1f1a14; text-decoration:none; font-size:15px; font-weight:600;">Complete signup</a>
  </div>
</div>
{% endblock %}
