{% extends "emails/base_email.html" %}

{% block email_content %}
<div style="text-align:center;">
  <div style="font-size:24px; line-height:1.3; font-weight:600; margin:0 0 14px;">
    Whisper is coming soon
  </div>
  <div style="font-size:16px; line-height:1.7; color:#4f463d; margin:0 auto; max-width:420px;">
    We’re getting closer to opening in your area. You’re still on the Whisper waitlist, and we’ll keep you posted as availability gets closer.
  </div>
  <div style="font-size:14px; line-height:1.7; color:#7a7065; margin:22px auto 0; max-width:420px;">
    Don’t want these waitlist updates? <a href="{{ unsubscribe_url }}" style="color:#1f1a14; text-decoration:underline;">Unsubscribe here</a>.
  </div>
</div>
{% endblock %}
